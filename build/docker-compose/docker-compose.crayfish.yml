networks:
  default:
    internal: true
services:
  homarus:
    restart: ${RESTART_POLICY:-unless-stopped}
    image: ${REPOSITORY:-islandora}/homarus:${TAG:-latest}
    volumes:
      - /etc/docker/custom-resolv.conf:/etc/resolv.conf
      - ../build/configs/custom_www.conf:/etc/php83/php-fpm.d/www.conf:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    deploy:
      resources:
          limits:
            memory: ${HOMARUS_MEMORY_LIMIT:-1G}
          reservations:
            memory: 512M
  houdini:
    restart: ${RESTART_POLICY:-unless-stopped}
    image: ${REPOSITORY:-islandora}/houdini:${TAG:-latest}
    volumes:
      - /etc/docker/custom-resolv.conf:/etc/resolv.conf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    networks:
      - default
    depends_on:
      - drupal
      - fcrepo
    deploy:
      resources:
          limits:
            memory: ${HOUDINI_MEMORY_LIMIT:-1G}
          reservations:
            memory: 512M
  hypercube:
    restart: ${RESTART_POLICY:-unless-stopped}
    image: ${REPOSITORY:-islandora}/hypercube:${TAG:-latest}
    volumes:
      - /etc/docker/custom-resolv.conf:/etc/resolv.conf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    deploy:
      resources:
          limits:
            memory: ${HYPERCUBE_MEMORY_LIMIT:-512M}
          reservations:
            memory: 256M
  milliner:
    restart: ${RESTART_POLICY:-unless-stopped}
    image: ${REPOSITORY:-islandora}/milliner:${TAG:-latest}
    volumes:
      - /etc/docker/custom-resolv.conf:/etc/resolv.conf
    environment:
      MILLINER_FEDORA6: ${FEDORA_6}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    networks:
      default:
      gateway:
    deploy:
      resources:
          limits:
            memory: ${MILLINER_MEMORY_LIMIT:-1G}
          reservations:
            memory: 512M
